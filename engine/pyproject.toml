[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resumeforge"
version = "0.1.0"
description = "Resume automation platform — core engine"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    # API
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # Data
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    # AI
    "litellm>=1.40.0",
    "jinja2>=3.1.4",
    # Export
    "python-docx>=1.1.2",
    "weasyprint>=62.3",
    "markdown-it-py>=3.0.0",
    # i18n
    "babel>=2.14.0",
    # Utils
    "rich>=13.7.0",
    "python-dotenv>=1.0.0",
    "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-snapshot>=0.9.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "types-Markdown>=3.6.0",
]

[project.scripts]
resumeforge-engine = "resumeforge.api.app:main"

[tool.hatch.build.targets.wheel]
packages = ["resumeforge"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
