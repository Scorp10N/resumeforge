name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v7
        with:
          version: latest
          args: release --clean
          workdir: cli/
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  docker-publish:
    name: Publish Docker images
    runs-on: ubuntu-latest
    needs: goreleaser
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push engine image
        uses: docker/build-push-action@v7
        with:
          context: ./engine
          push: true
          tags: |
            ghcr.io/scorp10n/resumeforge-engine:${{ github.ref_name }}
            ghcr.io/scorp10n/resumeforge-engine:latest

      - name: Build and push web image
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          build-args: VITE_ENGINE_URL=http://localhost:8080
          tags: |
            ghcr.io/scorp10n/resumeforge-web:${{ github.ref_name }}
            ghcr.io/scorp10n/resumeforge-web:latest
