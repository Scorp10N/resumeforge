name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 6am UTC

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  security:
    uses: Scorp10N/devsecops/.github/workflows/security-all.yml@main
    with:
      engine_dockerfile: "./engine"
      web_dockerfile: "./web"
      web_build_args: "VITE_ENGINE_URL=http://localhost:8080"
      go_version: "1.22"
      node_version: "20"
      has_go: true
      has_node: true
      has_containers: true
    secrets: inherit
