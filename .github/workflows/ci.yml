name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  engine:
    name: Engine (lint + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          version: "latest"
      - name: Install dependencies
        run: cd engine && uv sync --extra dev
      - name: Lint
        run: make lint-engine
      - name: Test
        run: make test-engine

  cli:
    name: CLI (lint + test + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: "1.25"
      - name: Lint
        run: make lint-cli
      - name: Test
        run: make test-cli
      - name: Build
        run: cd cli && go build ./...

  web:
    name: Web (type check + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
      - name: Install dependencies
        run: cd web && npm install
      - name: Type check
        run: make test-web
      - name: Build
        run: cd web && npm run build

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build engine image
        run: docker build ./engine -t resumeforge-engine:ci
      - name: Build web image
        run: docker build --build-arg VITE_ENGINE_URL=http://localhost:8080 ./web -t resumeforge-web:ci
